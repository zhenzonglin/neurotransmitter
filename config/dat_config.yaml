project_dir: /home/zhenzong2/analysis/neurotransmitter
inputs:
  lesion_glob: lesion/*.nii*
  phenotype_file: phenotype.xlsx
  phenotype_sheet: Sheet1
  lesion_subject_regex: ^(\d+)_Lesion
  phenotype_id_column: ID
  outcome_column: mRS_3m
  covariates:
    age: AGE
    nihss: A_NIHSS
    H_MRS: H_MRS
  categorical_maps:
    sex:
      男: 1
      女: 0
      '1': 1
      '0': 0
qc:
  exclude_empty_lesion: true
  min_lesion_volume_ml: 0.0
  exclude_m3_stroke: true
  m3_stroke_column: m3_stroke
  m3_stroke_exclude_values:
  - 2
analysis:
  outcome: mrs_3m
  cv_group_column: subject_id
  model_covariates:
  - age
  - nihss
  - lesion_volume_ml
  - H_MRS
  binary_outcome:
    threshold: 2
    positive_if_less_equal: true
  tables:
    lqt_edge_disconnection: lqt_edge_disconnection.csv
impact:
  n_splits: 10
  random_state: 42
  dataset_name: main
  weight_stat: t
  q_threshold: 0.05
  node_top_k: 20
  edge_top_k: 200
  use_q_if_available: true
  prediction_bootstrap: 1000
ml_profile:
  inner_splits: 5
  l1_ratios:
  - 0.1
  - 0.5
  - 0.9
  - 1.0
  alphas:
  - 0.0001
  - 0.0003
  - 0.001
  - 0.003
  - 0.01
  - 0.03
  - 0.1
  - 0.3
  - 1.0
resources:
  total_cores: 60
  memory_gb: 100
  blas_threads: 4
  lqt_jobs: 20
  lqt_dsi_cpus: 3
  lqt_dsi_memory: 4500m
  atlas_build_jobs: 8
  fold_jobs: 10
  edge_model_jobs: 50
  report_jobs: 8
prognostic_ntdc_atlas:
  output_dir: derivatives/prognostic_ntdc_atlas
  report_dir: derivatives/reports_prognostic_ntdc_atlas
  endpoints:
  - id: m3
    label: 3-month mRS
    outcome_column: mRS_3m
    outcome: mrs_3m
    stroke_column: m3_stroke
    stroke_exclude_values:
    - 2
  - id: m6
    label: 6-month mRS
    outcome_column: mRS_6m
    outcome: mrs_6m
    stroke_column: m6_stroke
    stroke_exclude_values:
    - 2
  - id: m12
    label: 12-month mRS
    outcome_column: mRS_12m
    outcome: mrs_12m
    stroke_column: y1_stroke
    stroke_exclude_values:
    - 2
  nt_ids: null
  n_splits: 10
  edge_damage_primary: fraction
  edge_damage_sensitivity: sum
  denominator_min_percentile: 5
  ridge_c: 1.0
  max_iter: 5000
  sensitivity_models:
  - elasticnet_logistic
  - linear_svm
  - gradient_boosting
  sensitivity_top_nodes: 156
  sensitivity_top_edges: 200
  prediction_bootstrap: 1000
  chunk_size: 256
  jobs: 8
  fold_jobs: 10
  edge_model_jobs: 50
neurotransmitters:
- alves_name: A4B2
  hansen_file: A4B2_flubatine_hc30_hillmer.nii.gz
