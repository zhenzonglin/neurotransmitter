project_dir: /home/zhenzong2/analysis/neurotransmitter
inputs:
  lesion_glob: lesion/*.nii*
  phenotype_file: phenotype.xlsx
  phenotype_sheet: Sheet1
  lesion_subject_regex: sub-(TMS\d{3})ses\d+
  phenotype_id_column: ID
  outcome_column: mRS_3m
  covariates:
    age: 年龄
    sex: 性别
    nihss: NIHSS
  categorical_maps:
    sex:
      男: 1
      女: 0
      '1': 1
      '0': 0
analysis:
  outcome: mrs_3m
  model_covariates:
  - age
  - sex
  - nihss
  - lesion_volume_ml
  binary_outcome:
    threshold: 2
    positive_if_less_equal: true
  tables:
    lqt_edge_disconnection: lqt_edge_disconnection.csv
impact:
  n_splits: 10
  random_state: 42
  dataset_name: main
  weight_stat: t
  q_threshold: 0.05
  node_top_k: 20
  edge_top_k: 200
  use_q_if_available: true
  prediction_bootstrap: 1000
